    <script type="text/babel">
      const { useState, useEffect } = React;

      const styles = `
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

      .header{background:linear-gradient(135deg,#f8fafc 0%,#eef2ff 45%,#f8fafc 100%);border-bottom:1px solid var(--border);padding:20px 32px;position:sticky;top:0;z-index:100}
      .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:24px;flex-wrap:wrap}

      .logo{display:flex;align-items:center;gap:10px;font-family:'Source Serif 4',serif;font-size:20px;font-weight:700;color:var(--accent)}

      .search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
      .analyze-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px}

      .report-shell{margin-bottom:64px}
      .report-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:24px;border-bottom:2px solid var(--text);margin-bottom:32px;flex-wrap:wrap;gap:20px}
      .report-title h1{font-family:'Source Serif 4',serif;font-size:32px;font-weight:700;margin-bottom:4px}
      .report-meta{font-size:14px;color:var(--text2)}
      .price-box{text-align:right;background:var(--bg3);padding:16px 24px;border-radius:8px;min-width:280px}

      .valuation-row{display:flex;gap:12px;margin-top:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

      .toc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-bottom:32px}
      .toc-title{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:12px}
      .toc-items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px}

      .section{margin-bottom:48px}
      .section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);position:relative}
      .section-header::after{content:'';position:absolute;left:0;bottom:0;width:120px;height:3px;background:var(--accent);border-radius:999px}
      .section-icon{width:36px;height:36px;background:var(--bg3);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
      .section-title{font-family:'Source Serif 4',serif;font-size:22px;font-weight:600}
      .research-content{font-family:'Source Serif 4',serif;font-size:16px;line-height:1.8}
      .research-content p{margin-bottom:16px;text-align:justify}
      .table-container{overflow-x:auto;margin:24px 0;border:1px solid var(--border);border-radius:8px}
      .data-table{width:100%;border-collapse:collapse;font-size:13px}
      .data-table th{background:var(--bg3);padding:12px 16px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
      .data-table td{padding:10px 16px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:12px}
      .data-table tr:last-child td{border-bottom:none}
      .data-table .label{font-family:'Inter',sans-serif;font-weight:500}
      .moat-table td:first-child{font-family:'Inter',sans-serif;font-weight:500}
      .moat-table td:nth-child(2){text-align:center;font-weight:600;color:var(--accent)}
      .moat-table td:last-child{font-family:'Inter',sans-serif;font-size:12px;color:var(--text2)}
      .dcf-summary{display:grid;grid-template-columns:1fr 1.5fr;gap:24px;margin:24px 0}
      @media(max-width:768px){.dcf-summary{grid-template-columns:1fr}}
      .dcf-inputs{background:var(--bg3);padding:20px;border-radius:8px}
      .dcf-inputs h4{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text3);margin-bottom:16px}
      .dcf-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
      .dcf-row:last-child{border-bottom:none}
      .dcf-label{font-size:13px;color:var(--text2)}
      .dcf-value{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500}
      .export-section{background:linear-gradient(135deg,#eff6ff 0%,#f5f3ff 100%);border:1px solid #c7d2fe;border-radius:12px;padding:24px;margin-top:48px}
      .export-title{font-family:'Source Serif 4',serif;font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:10px}
      .export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
      @media(max-width:600px){.export-grid{grid-template-columns:1fr}}
      .export-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px;cursor:pointer;transition:all 0.2s}
      .export-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(30,64,175,0.1)}
      .export-card h4{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
      .export-card p{font-size:13px;color:var(--text2)}
      .company-tabs{position:sticky;top:64px;background:var(--bg);padding:12px 0;z-index:90}
      .company-tabs-inner{max-width:1200px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;padding:0 32px}
      .company-tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);font-size:12px;font-weight:600;cursor:pointer}
      .company-tab.active{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 6px rgba(30,64,175,0.12)}
      .section-header{justify-content:space-between}
      .section-heading{display:flex;align-items:center;gap:12px}
      .section-toggle{border:1px solid var(--border);background:var(--bg2);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text2)}
      .wargame-btn{border:1px solid var(--border);background:var(--bg2);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
      .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.45);display:flex;align-items:center;justify-content:center;z-index:200}
      .modal{background:var(--bg2);border-radius:16px;max-width:720px;width:92%;padding:24px;border:1px solid var(--border);box-shadow:0 18px 50px rgba(15,23,42,0.25)}
      .modal h3{font-family:'Source Serif 4',serif;font-size:22px;margin-bottom:8px}
      .modal p{color:var(--text2);font-size:14px;margin-bottom:16px}
      .modal-grid{display:grid;gap:16px}
      .modal-row{display:grid;gap:8px}
      .modal-row label{font-size:12px;font-weight:600;color:var(--text2)}
      .modal-row input{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
      .checklist{display:grid;gap:8px}
      .check-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
      .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
      .primary-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
      .secondary-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
      .wargame-report{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--bg3)}
      .wargame-report h4{font-size:16px;margin-bottom:8px}
      .wargame-report p{font-size:13px;color:var(--text2);margin-bottom:8px}
      .boardpack-btn{border:1px solid var(--border);background:var(--bg2);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
      .reorder-panel{margin-top:12px;border:1px dashed var(--border);border-radius:10px;padding:12px;background:var(--bg3)}
      .reorder-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--border);cursor:grab;font-size:13px}
      .reorder-item + .reorder-item{margin-top:8px}
      .reorder-item.dragging{opacity:0.6}
      .reorder-hint{font-size:12px;color:var(--text3);margin-top:8px}
      .icon svg{display:block}
      .icon-14 svg{width:14px;height:14px}
      .icon-16 svg{width:16px;height:16px}
      .icon-18 svg{width:18px;height:18px}
      .icon-20 svg{width:20px;height:20px}
      .icon-48 svg{width:48px;height:48px}
      .control-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
      .mode-toggle{border:1px solid var(--border);background:var(--bg2);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
      .slider-group{display:grid;gap:12px;margin-top:16px}
      .slider{display:flex;flex-direction:column;gap:6px}
      .slider input{width:100%}
      .slider-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
      .heatmap td{text-align:center}
      .heatmap .heat-high{background:#dcfce7}
      .heatmap .heat-mid{background:#fef9c3}
      .heatmap .heat-low{background:#fee2e2}
      `;

      const Icon = ({ name, size = 16, className = '', color }) => (
        <i data-lucide={name} className={`icon icon-${size} ${className}`} style={color ? { color } : {}}></i>
      );

      const API_BASE = (() => {
        if (window.location.protocol === 'file:') {
          return 'http://127.0.0.1:3008';
        }
        return window.location.origin;
      })();

      const parseNumber = (value) => {
        if (!value || value === '--') return null;
        const stripped = String(value).replace(/[,$()]/g, '').replace(/x/g, '').replace(/%/g, '');
        const num = Number(stripped);
        return Number.isFinite(num) ? num : null;
      };

      const extractSeries = (row) => row.slice(1).map(parseNumber).filter((v) => v !== null);
      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const seedFromTicker = (ticker) => String(ticker || '').split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);

      const sumSeries = (series) => series.reduce((acc, val) => acc + val, 0);

      const CBCV_BASE = {
        BLK: { revenueB: 20.407, grossProfitB: null, sAndMB: null, debtB: 12.314, cashB: 12.762 },
        AAPL: { revenueB: 416.161, grossProfitB: 195.201, sAndMB: 19.524, debtB: 90.678, cashB: 35.934 },
        CPRT: { revenueB: 0.526, grossProfitB: 0.250, sAndMB: null, debtB: 0.011, cashB: 0.186 },
        IDXX: { revenueB: 3.898, grossProfitB: 2.379, sAndMB: 0.589, debtB: 0.618, cashB: 0.288 }
      };

      const cbcvSubscriptionLtv = (arpu, grossMargin, churnRate, discountRate) => {
        return (arpu * grossMargin) / (churnRate + discountRate);
      };

      const cbcvExistingSubscription = (subscribers, ltv) => subscribers * ltv;
      const cbcvFutureSubscription = (futureSubscribers, ltv, cac) => futureSubscribers * (ltv - cac);

      const cbcvTransactionalClv = (expectedTxns, contributionMargin, discountRate) => {
        return expectedTxns * contributionMargin / (1 + discountRate);
      };

      const cbcvExistingTransactional = (customers, params, economics, discountRate) => {
        const avgTxns = customers.reduce((acc, customer) => acc + customer.x, 0) / Math.max(customers.length, 1);
        return customers.length * cbcvTransactionalClv(avgTxns, economics.contributionMargin, discountRate);
      };

      const cbcvFutureTransactional = (numCustomers, expectedClv, cac) => numCustomers * (expectedClv - cac);

      const calcNetDebt = (data) => {
        const debtRow = data.financials?.balanceSheet?.find((row) => row[0] === 'Total Debt');
        const cashRow = data.financials?.balanceSheet?.find((row) => row[0] === 'Cash & Equivalents');
        const debtSeries = debtRow ? extractSeries(debtRow) : [];
        const cashSeries = cashRow ? extractSeries(cashRow) : [];
        const debt = debtSeries.length ? debtSeries[debtSeries.length - 1] : 0;
        const cash = cashSeries.length ? cashSeries[cashSeries.length - 1] : 0;
        return debt - cash;
      };

      const buildCbcvAnalysis = (data, overrides = {}) => {
        const base = CBCV_BASE[data.ticker];
        const revenueLatest = base?.revenueB ?? 0;
        const grossProfit = base?.grossProfitB ?? null;
        const grossMargin = grossProfit && revenueLatest ? grossProfit / revenueLatest : null;
        const sAndM = base?.sAndMB ?? (revenueLatest ? revenueLatest * 0.08 : 0.2);
        const netDebt = base ? (base.debtB - base.cashB) : calcNetDebt(data);
        const discountRate = 0.1;

        let model = 'subscription';
        if (data.ticker === 'CPRT') model = 'transactional';
        if (data.ticker === 'AAPL') model = 'hybrid';

        let summary = '';
        let detailRows = [];
        let enterpriseValue = 0;

        if (model === 'subscription') {
          const arpu = revenueLatest ? revenueLatest / 50 : 1.0;
          const grossMarginProxy = overrides.grossMargin ?? grossMargin ?? 0.55;
          const churn = overrides.churn ?? 0.06;
          const activeSubscribers = revenueLatest ? revenueLatest * 25 : 10;
          const futureGrowth = overrides.futureGrowth ?? 0.06;
          const futureSubscribers = activeSubscribers * futureGrowth;
          const cacBase = sAndM ? sAndM / Math.max(activeSubscribers, 1) : 0.2;
          const cac = overrides.cacFactor ? cacBase * overrides.cacFactor : cacBase;
          const ltv = cbcvSubscriptionLtv(arpu, grossMarginProxy, churn, discountRate);
          const existing = cbcvExistingSubscription(activeSubscribers, ltv);
          const future = cbcvFutureSubscription(futureSubscribers, ltv, cac);
          enterpriseValue = existing + future - netDebt;
          summary = `CBCV applies a subscription model to estimate value from recurring customer economics. SEC filings inform revenue, gross profit, and balance sheet inputs, while customer counts and churn are estimated to translate financials into LTV-based value.`;
          detailRows = [
            ['Model', 'CBCV-S (Subscription)'],
            ['SEC Revenue (10-K) ($B)', revenueLatest.toFixed(2)],
            ['Gross Margin (SEC)', grossMargin ? `${(grossMargin * 100).toFixed(1)}%` : 'Estimated 55.0%'],
            ['Estimated ARPU ($B)', arpu.toFixed(2)],
            ['Churn', `${(churn * 100).toFixed(1)}%`],
            ['Active Subscribers (M)', activeSubscribers.toFixed(1)],
            ['Future Subscribers (M)', futureSubscribers.toFixed(1)],
            ['CAC ($B)', cac.toFixed(2)],
            ['Existing Customer Value ($B)', existing.toFixed(1)],
            ['Future Customer Value ($B)', future.toFixed(1)],
            ['Net Debt ($B)', netDebt.toFixed(1)],
            ['CBCV Enterprise Value ($B)', enterpriseValue.toFixed(1)]
          ];
        }

        if (model === 'transactional') {
          const customerCount = Math.max(5, Math.round(revenueLatest * 2));
          const customers = Array.from({ length: customerCount }, () => ({ x: 2 }));
          const contributionMarginPct = overrides.contributionMarginPct ?? 0.35;
          const economics = { contributionMargin: revenueLatest ? revenueLatest * contributionMarginPct : 0.5 };
          const existing = cbcvExistingTransactional(customers, {}, economics, discountRate);
          const futureMultiplier = overrides.futureMultiplier ?? 1.5;
          const futureCustomers = revenueLatest ? revenueLatest * futureMultiplier : 10;
          const expectedClv = revenueLatest ? revenueLatest * 0.6 : 1.0;
          const cacBase = sAndM ? sAndM : (revenueLatest ? revenueLatest * 0.03 : 0.2);
          const cac = overrides.cacFactor ? cacBase * overrides.cacFactor : cacBase;
          const future = cbcvFutureTransactional(futureCustomers, expectedClv, cac);
          enterpriseValue = existing + future - netDebt;
          summary = `CBCV uses a transactional customer value framework, translating transaction intensity and contribution margins into customer lifetime value. SEC revenue, gross profit, and balance sheet data anchor the economics, while customer activity is estimated.`;
          detailRows = [
            ['Model', 'CBCV-T (Transactional)'],
            ['SEC Revenue (10-K) ($B)', revenueLatest.toFixed(2)],
            ['Gross Margin (SEC)', grossMargin ? `${(grossMargin * 100).toFixed(1)}%` : 'Estimated'],
            ['Avg Txns / Customer', (customers.reduce((acc, c) => acc + c.x, 0) / customers.length).toFixed(1)],
            ['Contribution Margin ($B)', economics.contributionMargin.toFixed(2)],
            ['Future Customers (M)', futureCustomers.toFixed(1)],
            ['Expected New CLV ($B)', expectedClv.toFixed(2)],
            ['CAC ($B)', cac.toFixed(2)],
            ['Existing Customer Value ($B)', existing.toFixed(1)],
            ['Future Customer Value ($B)', future.toFixed(1)],
            ['Net Debt ($B)', netDebt.toFixed(1)],
            ['CBCV Enterprise Value ($B)', enterpriseValue.toFixed(1)]
          ];
        }

        if (model === 'hybrid') {
          const servicesComponent = revenueLatest * 0.28;
          const productsComponent = revenueLatest - servicesComponent;
          const arpu = servicesComponent ? servicesComponent / 120 : 1.0;
          const grossMarginProxy = overrides.grossMargin ?? grossMargin ?? 0.46;
          const churn = overrides.churn ?? 0.05;
          const activeSubscribers = servicesComponent ? servicesComponent * 40 : 20;
          const futureGrowth = overrides.futureGrowth ?? 0.06;
          const futureSubscribers = activeSubscribers * futureGrowth;
          const cacBase = sAndM ? sAndM / Math.max(activeSubscribers, 1) : 0.2;
          const cac = overrides.cacFactor ? cacBase * overrides.cacFactor : cacBase;
          const ltv = cbcvSubscriptionLtv(arpu, grossMarginProxy, churn, discountRate);
          const existingServices = cbcvExistingSubscription(activeSubscribers, ltv);
          const futureServices = cbcvFutureSubscription(futureSubscribers, ltv, cac);
          const customers = [{ x: 1 }, { x: 2 }];
          const contributionMarginPct = overrides.contributionMarginPct ?? 0.3;
          const economics = { contributionMargin: productsComponent * contributionMarginPct };
          const existingProducts = cbcvExistingTransactional(customers, {}, economics, discountRate);
          const futureProducts = cbcvFutureTransactional(productsComponent * 1.5, productsComponent * 0.5, productsComponent * 0.02);
          enterpriseValue = existingServices + futureServices + existingProducts + futureProducts - netDebt;
          summary = `CBCV applies a hybrid model that values services (subscription economics) and products (transactional economics) separately. SEC revenue and gross profit inform margins, while customer activity assumptions translate the model into value.`;
          detailRows = [
            ['Model', 'CBCV-H (Hybrid)'],
            ['SEC Revenue (10-K) ($B)', revenueLatest.toFixed(1)],
            ['Gross Margin (SEC)', grossMargin ? `${(grossMargin * 100).toFixed(1)}%` : 'Estimated'],
            ['Services Revenue ($B)', servicesComponent.toFixed(1)],
            ['Products Revenue ($B)', productsComponent.toFixed(1)],

            return { ...prev, [tickerSymbol]: nextOpen };

            delete next[tickerSymbol];

            const targetIndex = next.indexOf(targetId);

              next.push(draggingId);

                                  <tr>
                                    <th>Company</th>
                                    {heatmap.baseRows.map((metric) => <th key={metric.key}>{metric.label}</th>)}
                                  </tr>
                                </thead>
                                <tbody>
                                  {heatmap.rows.map((row, j) => (
                                    <tr key={j}>
                                      <td className="label">{row.name} ({row.ticker})</td>
                                      {heatmap.baseRows.map((metric) => {
                                        const value = row[metric.key];
                                        const className = heatmap.ranks[metric.key](value);
                                        const formatted = metric.key.includes('Margin') || metric.key === 'cagr'
                                          ? Number.isFinite(value) ? `${(value * 100).toFixed(1)}%` : '--'
                                          : Number.isFinite(value) ? value.toFixed(1) : '--';
                                        return (
                                          <td key={metric.key} className={className}>{formatted}</td>
                                        );
                                      })}
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          )}

                          {!isCollapsed(data.ticker, section) && section.sources && (
                            <div>
                              <div className="note">Live mode lists exact filing links and transcript sources. Demo placeholders appear when offline.</div>
                              <div className="table-container">
                                <table className="data-table">
                                  <thead><tr><th>Source</th><th>Details</th></tr></thead>
                                  <tbody>
                                    {sourceRows.map((row, j) => (
                                      <tr key={j}>
                                        <td className="label">{row[0]}</td>
                                        <td>{row[1]}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}

                          {!isCollapsed(data.ticker, section) && section.chat && (
                            <div>
                              <p className="note">Ask investor or competitor-style questions that are not explicitly listed in the profile.</p>
                              <div style={{ display: 'flex', gap: '12px', marginTop: '12px', marginBottom: '16px' }}>
                                <input
                                  className="search-input"
                                  style={{ flex: 1 }}
                                  placeholder={`Ask about ${data.ticker} (e.g., \"Where is the moat weakest?\")`}
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter') {
                                      handleAsk(data.ticker, report, e.target.value);
                                      e.target.value = '';
                                    }
                                  }}
                                />
                                <button
                                  className="analyze-btn"
                                  onClick={(e) => {
                                    const input = e.currentTarget.parentElement.querySelector('input');
                                    handleAsk(data.ticker, report, input.value);
                                    input.value = '';
                                  }}
                                >
                                  Ask
                                </button>
                              </div>
                              {(questions[data.ticker] || []).length === 0 ? (
                                <div className="note">No questions yet.</div>
                              ) : (
                                <div className="table-container">
                                  <table className="data-table">
                                    <thead><tr><th>Question</th><th>Answer</th></tr></thead>
                                    <tbody>
                                      {(questions[data.ticker] || []).map((item, idx) => (
                                        <tr key={idx}>
                                          <td className="label">{item.question}</td>
                                          <td>{item.response}</td>
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                                </div>
                              )}
                            </div>
                          )}
                        </section>
                      ))}

                      <div className="export-section">
                        <div className="export-title"><Icon name="download" size={20} color="#1e40af" />Export Research</div>
                        <div className="export-grid">
                          <div className="export-card" onClick={() => alert('Export is available in the full deployment.') }>
                            <h4><Icon name="layers" size={16} color="#1e40af" /> Excel Financial Model</h4>
                            <p>Built from preloaded statements.</p>
                          </div>
                          <div className="export-card" onClick={() => alert('Export is available in the full deployment.') }>
                            <h4><Icon name="file-text" size={16} color="#1e40af" /> PDF Research Report</h4>
                            <p>Includes narrative and scenario framing.</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </main>

              {wargameOpen && (
                <div className="modal-backdrop">
                  <div className="modal">
                    <h3>Analyze from a competitor point of view?</h3>
                    <p>Generate a war game report for {wargameTarget}. Choose a competitor, select the analyses to run, and generate a strategic response.</p>
                    <div className="modal-grid">
                      <div className="modal-row">
                        <label>Your company name</label>
                        <input
                          value={wargameCompany}
                          onChange={(e) => setWargameCompany(e.target.value)}
                          placeholder="e.g., Vanguard"
                        />
                      </div>
                      <div className="modal-row">
                        <label>Analysis modules</label>
                        <div className="checklist">
                          {warGameOptions.map((opt) => (
                            <label key={opt.id} className="check-item">
                              <input
                                type="checkbox"
                                checked={Boolean(wargameSelections[opt.id])}
                                onChange={(e) => setWargameSelections((prev) => ({ ...prev, [opt.id]: e.target.checked }))}
                              />
                              {opt.label}
                            </label>
                          ))}
                        </div>
                      </div>
                    </div>
                    <div className="modal-actions">
                      <button className="secondary-btn" onClick={() => setWargameOpen(false)}>Cancel</button>
                      <button className="primary-btn" onClick={generateWarGame}>Generate War Game</button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
